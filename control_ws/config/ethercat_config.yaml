# ======================================================
# EtherCAT 主站通信配置
# 适配环境：Ubuntu 24.04 + SOEM (新版 ecx_* API) + 雷赛 L6N 伺服
# ======================================================

ethercat:
  # ----------------------------------------
  # 🧩 基础网络设置
  # ----------------------------------------
  iface: "enp4s0"            # 网卡名称（与 start_scan.sh 保持一致）
  expected_slaves: 1         # 期望连接的从站数量
  timeout_us: 5000           # 通信超时 (微秒)
  retry_on_fail: 3           # 初始化失败时重试次数

  # ----------------------------------------
  # ⚙️ 同步与时钟控制
  # ----------------------------------------
  dc_enable: false            # 是否启用分布式时钟 (DC)
  sync_mode: "FreeRun"            # 同步模式：DC / FreeRun
  cycle_time_ns: 1000000     # EtherCAT 周期时间 (1 kHz = 1,000,000 ns)
  dc_shift_ns: 0             # 主站时钟偏移调整（高级用途，可保持 0）
  dc_sync_shift_ns: 0        # 分布式同步偏移（默认 0）

  # ----------------------------------------
  # 🧱 Watchdog 与状态管理
  # ----------------------------------------
  watchdog_ms: 100           # Watchdog 超时 (毫秒)
  auto_recover: true         # 从站掉线是否自动重连
  state_check_interval_ms: 500  # 状态检查周期

  # ----------------------------------------
  # 📊 调试与输出
  # ----------------------------------------
  print_slave_info: true     # 启动时打印从站信息
  print_wkc: false           # 是否打印每周期工作计数 (WKC)
  log_cycle_stat: true       # 是否记录周期统计信息

  # ----------------------------------------
  # 🔧 高级参数（一般保持默认）
  # ----------------------------------------
  eeprom_access: false       # 是否允许访问从站 EEPROM
  safe_op_before_op: true    # 是否在进入 OPERATIONAL 前进入 SAFE_OP
  bus_reinit_on_error: true  # 检测到总线错误时自动重新初始化

  # ----------------------------------------
  # 📁 配置文件路径（用于多节点共享）
  # ----------------------------------------
  log_dir: "~/桌面/HM01/logs"   # EtherCAT 日志目录
  eni_file: ""                   # ENI 配置文件路径（若使用 TwinCAT 生成的 XML，可在此指定）
